<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <form method="post" action="/user">

        <label for="name">Имя:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Пароль:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="ReqvestPassword">Подтвердите пароль:</label><br>
        <input type="password" id="ReqvestPassword" name="ReqvestPassword" required><br><br>

        <label for="age">Возраст:</label><br>
        <input type="number" step="1" min="18" max="100" id="age" name="age" required><br><br>

        <label for="phoneNumber">Номер телефона:</label><br>
        <input type="number" id="phoneNumber" name="phoneNumber" required><br><br>

        <label for="add">Источник рекламы:</label>
        <select id="add" name="add">
            <option value="Google" name="add">Google</option>
            <option value="Facebook" name="add">Facebook</option>
            <option value="Instagram" name="add">Instagram</option>
        </select>
        <br><br>
        <button type="submit">Отправить</button>
    </form>
</body>
</html>
