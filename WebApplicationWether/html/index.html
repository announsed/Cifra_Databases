<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вы вошли</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff3e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .welcome-container {
            text-align: center;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #ff9800;
            margin-bottom: 10px;
        }

        p {
            color: #333;
            margin-bottom: 20px;
        }

        button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff9800;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }

        button:hover {
                background-color: #f57c00;
            }
    </style>
</head>

<body>
    <div class="welcome-container">
        <h1>Добро пожаловать!</h1>
        <p>Вы успешно вошли в систему.</p>
        <form action="https://localhost:7068/index" method="POST">
            <button type="submit">Выйти</button>
        </form>
    </div>
</body>

</html>
